version: '3.8'

services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: .
    ports:
      - "8001:8001"
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - DATABASE_NAME=legacy_vault
      - ADMIN_PASSWORD=A@070610
      - EMERGENT_LLM_KEY=${EMERGENT_LLM_KEY}
      - MONITOR_INTERVAL=60
    depends_on:
      - mongo

volumes:
  mongo_data: